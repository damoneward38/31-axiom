<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QUANTUM.lab — Particle Simulation</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#05050f;--panel:#0d0d20;--card:#111128;--cyan:#00f5ff;--purple:#bf00ff;--orange:#ff6b35;--blue:#4a9eff;--green:#00ff88;--text:#e8e8f0;--muted:#6b7280;--border:rgba(0,245,255,.1)}
body{background:var(--bg);color:var(--text);font-family:'JetBrains Mono','Fira Code',monospace;min-height:100vh;overflow-x:hidden}
.dashboard{display:flex;flex-direction:column;min-height:100vh;padding:0 24px 24px}
.lab-header{display:flex;align-items:center;justify-content:space-between;padding:20px 0;border-bottom:1px solid var(--border)}
.logo{display:flex;align-items:center;gap:10px}
.logo-symbol{font-size:28px;color:var(--cyan);filter:drop-shadow(0 0 8px var(--cyan))}
.logo-text{font-size:22px;font-weight:700;letter-spacing:3px}
.logo-accent{color:var(--cyan)}
.header-status{display:flex;align-items:center;gap:8px}
.status-dot{width:8px;height:8px;border-radius:50%}
.status-dot.running{background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 1.5s ease-in-out infinite}
.status-dot.paused{background:var(--orange);box-shadow:0 0 8px var(--orange)}
.status-text{font-size:11px;letter-spacing:2px;color:var(--muted)}
.main-layout{display:flex;gap:20px;flex:1;margin-top:16px}
.canvas-wrapper{flex:1;display:flex;flex-direction:column;gap:8px}
.quantum-canvas{border:1px solid var(--border);box-shadow:0 0 40px rgba(0,245,255,.05);width:100%;border-radius:12px;cursor:crosshair}
.canvas-hint{font-size:11px;color:var(--muted);text-align:center;letter-spacing:1px}
.side-panel{width:340px;flex-shrink:0;background:var(--panel);border:1px solid var(--border);border-radius:16px;display:flex;flex-direction:column;overflow:hidden;max-height:calc(100vh - 120px)}
.tabs{display:flex;border-bottom:1px solid var(--border)}
.tab{flex:1;padding:12px 0;background:transparent;border:none;color:var(--muted);font-family:inherit;font-size:11px;letter-spacing:1px;cursor:pointer;transition:all .2s;text-transform:uppercase}
.tab:hover{color:var(--text)}
.tab-active{color:var(--cyan);border-bottom:2px solid var(--cyan)}
.tab-content{flex:1;padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.metric-card{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid transparent;border-left-width:3px;border-radius:6px;padding:10px 14px;transition:all .2s}
.metric-card:hover{background:#161632}
.metric-label{font-size:11px;color:var(--muted);letter-spacing:1px;text-transform:uppercase}
.metric-value{font-size:18px;font-weight:700}
.metric-unit{font-size:11px;font-weight:400;margin-left:2px}
.control-slider{display:flex;flex-direction:column;gap:6px}
.control-header{display:flex;justify-content:space-between;align-items:center}
.control-label{font-size:11px;color:var(--muted);letter-spacing:1px;text-transform:uppercase}
.control-value{font-size:12px;color:var(--cyan)}
.slider{-webkit-appearance:none;width:100%;height:3px;background:linear-gradient(to right,var(--cyan),var(--purple));border-radius:2px;outline:none;cursor:pointer}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--cyan);box-shadow:0 0 6px var(--cyan);cursor:pointer}
.control-toggle{display:flex;justify-content:space-between;align-items:center}
.toggle{padding:4px 14px;border-radius:20px;border:1px solid;font-family:inherit;font-size:11px;cursor:pointer;transition:all .2s}
.toggle-on{background:rgba(0,255,136,.1);border-color:var(--green);color:var(--green)}
.toggle-off{background:rgba(107,114,128,.1);border-color:var(--muted);color:var(--muted)}
.btn-primary{padding:10px 20px;background:transparent;border:1px solid var(--cyan);color:var(--cyan);border-radius:6px;font-family:inherit;font-size:12px;letter-spacing:1px;cursor:pointer;transition:all .2s}
.btn-primary:hover:not(:disabled){background:rgba(0,245,255,.1);box-shadow:0 0 12px rgba(0,245,255,.2)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed}
.btn-danger{padding:10px 20px;background:transparent;border:1px solid #ff4444;color:#ff4444;border-radius:6px;font-family:inherit;font-size:12px;cursor:pointer;transition:all .2s}
.btn-danger:hover{background:rgba(255,68,68,.1)}
.btn-remove{background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:12px;padding:2px 6px}
.btn-remove:hover{color:#ff4444}
.full-width{width:100%}
.experiment-form{display:flex;flex-direction:column;gap:8px}
.input-field{width:100%;background:var(--card);border:1px solid var(--border);border-radius:6px;padding:10px 12px;color:var(--text);font-family:inherit;font-size:12px;outline:none;transition:all .2s;resize:none}
.input-field:focus{border-color:var(--cyan)}
.input-field::placeholder{color:var(--muted)}
.experiment-log{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.experiment-card{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:12px}
.exp-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.exp-name{font-size:13px;font-weight:600;color:var(--text)}
.exp-status{font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:2px 8px;border-radius:20px}
.exp-running{background:rgba(0,255,136,.1);color:var(--green)}
.exp-desc{font-size:11px;color:var(--muted);margin-bottom:8px;line-height:1.5}
.exp-meta{display:flex;gap:12px;font-size:10px;color:var(--muted)}
.well-list{margin-top:4px}
.section-title{font-size:11px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:8px}
.well-item{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid rgba(191,0,255,.2);border-radius:6px;padding:6px 10px;font-size:11px;color:var(--purple)}
.notification{position:fixed;bottom:24px;right:24px;background:var(--card);border:1px solid var(--cyan);border-radius:10px;padding:12px 20px;font-size:12px;color:var(--cyan);box-shadow:0 0 20px rgba(0,245,255,.15);z-index:999;animation:slideIn .3s ease}
.empty-state{text-align:center;color:var(--muted);font-size:12px;padding:20px 0}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 8px var(--green)}50%{opacity:.5;box-shadow:0 0 2px var(--green)}}
@keyframes slideIn{from{transform:translateX(20px);opacity:0}to{transform:translateX(0);opacity:1}}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
::-webkit-scrollbar-thumb:hover{background:var(--cyan)}
@media(max-width:1024px){.main-layout{flex-direction:column}.side-panel{width:100%;max-height:none}}
</style>
</head>
<body>
<div class="dashboard">
  <header class="lab-header">
    <div class="logo">
      <span class="logo-symbol">⬡</span>
      <span class="logo-text">QUANTUM<span class="logo-accent">.lab</span></span>
    </div>
    <div class="header-status">
      <span class="status-dot running" id="statusDot"></span>
      <span class="status-text" id="statusText">SIMULATION ACTIVE</span>
    </div>
    <button class="btn-primary" id="pauseBtn" onclick="toggleSim()">⏸ Pause</button>
  </header>
  <div class="main-layout">
    <div class="canvas-wrapper">
      <canvas class="quantum-canvas" id="canvas" onclick="addGravityWell(event)"></canvas>
      <p class="canvas-hint">Click anywhere to spawn a gravity well</p>
    </div>
    <aside class="side-panel">
      <div class="tabs">
        <button class="tab tab-active" data-tab="metrics" onclick="switchTab('metrics',this)">Metrics</button>
        <button class="tab" data-tab="controls" onclick="switchTab('controls',this)">Controls</button>
        <button class="tab" data-tab="experiments" onclick="switchTab('experiments',this)">Experiments</button>
      </div>
      <div class="tab-content" id="tabMetrics">
        <div class="metric-card"><span class="metric-label">FPS</span><span class="metric-value" style="color:var(--cyan)" id="mFPS">0</span></div>
        <div class="metric-card"><span class="metric-label">Active Particles</span><span class="metric-value" style="color:var(--blue)" id="mPart">0</span></div>
        <div class="metric-card"><span class="metric-label">Total Energy</span><span class="metric-value" style="color:var(--orange)" id="mEnergy">0 <span class="metric-unit">eV</span></span></div>
        <div class="metric-card"><span class="metric-label">Entangled Pairs</span><span class="metric-value" style="color:var(--purple)" id="mEntangle">0</span></div>
        <div class="metric-card"><span class="metric-label">Collapse Events</span><span class="metric-value" style="color:#ff4444" id="mCollapse">0</span></div>
        <div class="metric-card"><span class="metric-label">Gravity Wells</span><span class="metric-value" style="color:var(--green)" id="mWells">0</span></div>
        <div class="well-list" id="wellList"></div>
      </div>
      <div class="tab-content" id="tabControls" style="display:none">
        <div class="control-slider"><div class="control-header"><span class="control-label">Max Particles</span><span class="control-value" id="cvMax">200</span></div><input type="range" class="slider" min="10" max="500" step="10" value="200" oninput="setCfg('maxParticles',+this.value)"></div>
        <div class="control-slider"><div class="control-header"><span class="control-label">Simulation Speed</span><span class="control-value" id="cvSpeed">1.00</span></div><input type="range" class="slider" min="0.1" max="5" step="0.1" value="1" oninput="setCfg('simSpeed',+this.value)"></div>
        <div class="control-slider"><div class="control-header"><span class="control-label">Energy Decay</span><span class="control-value" id="cvDecay">0.05</span></div><input type="range" class="slider" min="0" max="0.5" step="0.01" value="0.05" oninput="setCfg('decay',+this.value)"></div>
        <div class="control-toggle"><span class="control-label">Collision Detection</span><button class="toggle toggle-off" id="collToggle" onclick="toggleColl()">OFF</button></div>
        <button class="btn-danger full-width" onclick="clearWells()">Clear All Wells</button>
      </div>
      <div class="tab-content" id="tabExperiments" style="display:none">
        <div class="experiment-form">
          <input class="input-field" placeholder="Experiment name..." id="expName" maxlength="50">
          <textarea class="input-field" placeholder="Description (optional)..." id="expDesc" maxlength="200" rows="3"></textarea>
          <button class="btn-primary full-width" onclick="createExp()">+ Create Snapshot</button>
        </div>
        <div class="experiment-log" id="expLog"><div class="empty-state">No experiments yet.</div></div>
      </div>
    </aside>
  </div>
</div>

<script>
const COLORS={superposition:'#00f5ff',entangled:'#bf00ff',collapsed:'#ff6b35',idle:'#4a9eff'};
let particles=[],gravityWells=[],experiments=[];
let cfg={maxParticles:200,simSpeed:1,decay:0.05,collision:false};
let isRunning=true,particleId=0,lastTime=performance.now(),fpsFrames=[];
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d',{alpha:false});

function resizeCanvas(){
  const w=canvas.parentElement;
  canvas.width=w.clientWidth;
  canvas.height=Math.min(window.innerHeight-200,600);
}
window.addEventListener('resize',resizeCanvas);
resizeCanvas();

function getState(e){if(e>75)return'superposition';if(e>50)return'entangled';if(e>25)return'collapsed';return'idle';}

function createParticle(){
  const state=getState(Math.random()*100);
  return{
    id:'p-'+ ++particleId,x:Math.random()*canvas.width,y:Math.random()*canvas.height,
    vx:(Math.random()-.5)*2,vy:(Math.random()-.5)*2,
    energy:Math.random()*100,state,color:COLORS[state],
    radius:Math.random()*3+1,lifetime:Math.random()*300+100,age:0
  };
}

function updateParticle(p,dt){
  p.age+=dt;
  if(p.age>=p.lifetime)return null;
  for(const gw of gravityWells){
    const dx=gw.x-p.x,dy=gw.y-p.y,d=Math.sqrt(dx*dx+dy*dy);
    if(d<gw.radius&&d>0){const f=(gw.strength/(d*d))*dt;p.vx+=dx/d*f;p.vy+=dy/d*f;}
  }
  p.x+=p.vx*cfg.simSpeed*dt;p.y+=p.vy*cfg.simSpeed*dt;
  p.energy=Math.max(0,p.energy-cfg.decay*dt);
  p.state=getState(p.energy);p.color=COLORS[p.state];
  p.x=((p.x%canvas.width)+canvas.width)%canvas.width;
  p.y=((p.y%canvas.height)+canvas.height)%canvas.height;
  return p;
}

function drawGrid(){
  ctx.save();ctx.strokeStyle='rgba(0,245,255,.03)';ctx.lineWidth=0.5;
  for(let x=0;x<canvas.width;x+=60){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,canvas.height);ctx.stroke();}
  for(let y=0;y<canvas.height;y+=60){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvas.width,y);ctx.stroke();}
  ctx.restore();
}

function drawGravityWells(){
  gravityWells.forEach(gw=>{
    const grad=ctx.createRadialGradient(gw.x,gw.y,0,gw.x,gw.y,gw.radius);
    grad.addColorStop(0,'rgba(191,0,255,.2)');grad.addColorStop(.5,'rgba(191,0,255,.05)');grad.addColorStop(1,'rgba(191,0,255,0)');
    ctx.beginPath();ctx.arc(gw.x,gw.y,gw.radius,0,Math.PI*2);ctx.fillStyle=grad;ctx.fill();
    ctx.beginPath();ctx.arc(gw.x,gw.y,4,0,Math.PI*2);ctx.fillStyle='#bf00ff';ctx.shadowBlur=20;ctx.shadowColor='#bf00ff';ctx.fill();ctx.shadowBlur=0;
  });
}

function drawEntanglement(){
  const entangled=particles.filter(p=>p.state==='entangled');
  for(let i=0;i<entangled.length;i++){
    for(let j=i+1;j<entangled.length;j++){
      const p1=entangled[i],p2=entangled[j];
      const dist=Math.sqrt((p2.x-p1.x)**2+(p2.y-p1.y)**2);
      if(dist>150)continue;
      ctx.save();ctx.globalAlpha=(1-dist/150)*.4;ctx.strokeStyle='#bf00ff';ctx.lineWidth=0.5;
      ctx.shadowBlur=8;ctx.shadowColor='#bf00ff';
      ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.stroke();ctx.restore();
    }
  }
}

function drawParticles(){
  particles.forEach(p=>{
    const alpha=1-p.age/p.lifetime;
    ctx.save();ctx.globalAlpha=Math.max(0,alpha);ctx.shadowBlur=15;ctx.shadowColor=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.radius,0,Math.PI*2);ctx.fillStyle=p.color;ctx.fill();
    if(p.energy>70){ctx.beginPath();ctx.arc(p.x,p.y,p.radius*2.5,0,Math.PI*2);ctx.strokeStyle=p.color;ctx.lineWidth=.5;ctx.globalAlpha=alpha*.3;ctx.stroke();}
    ctx.restore();
  });
}

function animate(ts){
  if(isRunning){
    const dt=Math.min((ts-lastTime)/16.67,3);lastTime=ts;
    fpsFrames.push(1000/Math.max(ts-lastTime+.001,1));
    if(fpsFrames.length>60)fpsFrames.shift();
    let updated=particles.map(p=>updateParticle(p,dt)).filter(Boolean);
    while(updated.length<cfg.maxParticles)updated.push(createParticle());
    particles=updated;
  }
  ctx.fillStyle='rgba(5,5,15,.85)';ctx.fillRect(0,0,canvas.width,canvas.height);
  drawGrid();drawEntanglement();drawGravityWells();drawParticles();
  if(isRunning&&fpsFrames.length>0){
    const fps=Math.round(fpsFrames.reduce((a,b)=>a+b,0)/fpsFrames.length);
    document.getElementById('mFPS').textContent=fps;
    document.getElementById('mPart').textContent=particles.length;
    const totalE=Math.round(particles.reduce((s,p)=>s+p.energy,0));
    document.getElementById('mEnergy').innerHTML=totalE+' <span class="metric-unit">eV</span>';
    document.getElementById('mEntangle').textContent=Math.floor(particles.filter(p=>p.state==='entangled').length/2);
    document.getElementById('mCollapse').textContent=particles.filter(p=>p.state==='collapsed').length;
  }
  document.getElementById('mWells').textContent=gravityWells.length;
  requestAnimationFrame(animate);
}

function toggleSim(){
  isRunning=!isRunning;
  document.getElementById('statusDot').className='status-dot '+(isRunning?'running':'paused');
  document.getElementById('statusText').textContent=isRunning?'SIMULATION ACTIVE':'PAUSED';
  document.getElementById('pauseBtn').textContent=isRunning?'⏸ Pause':'▶ Resume';
}

function addGravityWell(e){
  const rect=canvas.getBoundingClientRect();
  const x=e.clientX-rect.left,y=e.clientY-rect.top;
  gravityWells.push({id:'gw-'+Date.now(),x,y,strength:5000,radius:200});
  notify('⚛ Gravity well at ('+Math.round(x)+', '+Math.round(y)+')');
  renderWells();
}

function removeWell(id){gravityWells=gravityWells.filter(w=>w.id!==id);renderWells();}
function clearWells(){gravityWells=[];renderWells();notify('All gravity wells cleared');}
function toggleColl(){
  cfg.collision=!cfg.collision;
  const btn=document.getElementById('collToggle');
  btn.className='toggle '+(cfg.collision?'toggle-on':'toggle-off');
  btn.textContent=cfg.collision?'ON':'OFF';
}

function setCfg(key,val){
  cfg[key]=val;
  if(key==='maxParticles')document.getElementById('cvMax').textContent=val;
  if(key==='simSpeed')document.getElementById('cvSpeed').textContent=val.toFixed(1);
  if(key==='decay')document.getElementById('cvDecay').textContent=val.toFixed(2);
}

function renderWells(){
  document.getElementById('wellList').innerHTML=gravityWells.length?'<h3 class="section-title">Active Wells</h3>'+gravityWells.map(w=>'<div class="well-item"><span>('+Math.round(w.x)+', '+Math.round(w.y)+')</span><button class="btn-remove" onclick="removeWell(\''+w.id+'\')">✕</button></div>').join(''):'';
}

function switchTab(name,el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('tab-active'));
  el.classList.add('tab-active');
  ['tabMetrics','tabControls','tabExperiments'].forEach(id=>document.getElementById(id).style.display='none');
  document.getElementById('tab'+name.charAt(0).toUpperCase()+name.slice(1)).style.display='flex';
}

function createExp(){
  const name=document.getElementById('expName').value.trim();
  if(!name)return;
  const exp={id:'exp-'+Date.now(),name,desc:document.getElementById('expDesc').value.trim(),status:'running',particles:particles.length,energy:Math.round(particles.reduce((s,p)=>s+p.energy,0)),time:new Date().toLocaleTimeString()};
  experiments.unshift(exp);
  document.getElementById('expName').value='';document.getElementById('expDesc').value='';
  notify('🧪 Experiment "'+name+'" created');
  renderExps();
}

function renderExps(){
  document.getElementById('expLog').innerHTML=experiments.length?experiments.map(e=>'<div class="experiment-card"><div class="exp-header"><span class="exp-name">'+e.name+'</span><span class="exp-status exp-running">'+e.status+'</span></div>'+(e.desc?'<p class="exp-desc">'+e.desc+'</p>':'')+'<div class="exp-meta"><span>⚛ '+e.particles+' particles</span><span>⚡ '+e.energy+' eV</span><span>'+e.time+'</span></div></div>').join(''):'<div class="empty-state">No experiments yet.</div>';
}

function notify(msg){
  const n=document.createElement('div');n.className='notification';n.textContent=msg;
  document.body.appendChild(n);setTimeout(()=>n.remove(),3000);
}

particles=Array.from({length:cfg.maxParticles},()=>createParticle());
requestAnimationFrame(animate);
</script>
</body>
</html>
